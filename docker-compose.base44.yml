services:
  client:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL_DEV=https://5000-${BASE44_PUBLIC_HOST_SUFFIX}/api/v1
      - NEXT_PUBLIC_SOCKET_URL=https://5000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_DEMO_MODE=false
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      server:
        condition: service_started
    volumes:
      - ./src/client:/app
      - client_node_modules:/app/node_modules
    command: >
      sh -c "npm install && npm run dev -- -H 0.0.0.0"
    restart: unless-stopped

  server:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://ecommerce:ecommerce123@db:5432/b2c_ecommerce
      - REDIS_URL=redis://redis:6379
      - ACCESS_TOKEN_SECRET=dev_access_secret_key_12345
      - REFRESH_TOKEN_SECRET=dev_refresh_secret_key_12345
      - SESSION_SECRET=dev_session_secret_12345
      - COOKIE_SECRET=dev_cookie_secret_12345
      - COOKIE_DOMAIN=localhost
      - ALLOWED_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX},http://localhost:3000
      - CLIENT_URL_DEV=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - CLIENT_URL_PROD=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - STRIPE_PUBLIC_KEY=pk_test_placeholder
      - STRIPE_SECRET_KEY=sk_test_placeholder
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder
      - GOOGLE_CLIENT_ID=placeholder
      - GOOGLE_CLIENT_SECRET=placeholder
      - GOOGLE_CALLBACK_URL_DEV=http://localhost:5000/api/v1/auth/google/callback
      - FACEBOOK_APP_ID=placeholder
      - FACEBOOK_APP_SECRET=placeholder
      - FACEBOOK_CALLBACK_URL_DEV=http://localhost:5000/api/v1/auth/facebook/callback
      - TWITTER_CONSUMER_KEY=placeholder
      - TWITTER_CONSUMER_SECRET=placeholder
      - TWITTER_CALLBACK_URL_DEV=http://localhost:5000/api/v1/auth/twitter/callback
      - EMAIL_USER=placeholder@example.com
      - EMAIL_PASS=placeholder
      - CLOUDINARY_CLOUD_NAME=placeholder
      - CLOUDINARY_API_KEY=placeholder
      - CLOUDINARY_API_SECRET=placeholder
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/server:/app
      - server_node_modules:/app/node_modules
    command: >
      sh -c "npm install && npx prisma generate && npm run dev"
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce123
      POSTGRES_DB: b2c_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d b2c_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: node:22-alpine
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://ecommerce:ecommerce123@db:5432/b2c_ecommerce
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    volumes:
      - ./src/server:/app
      - server_node_modules:/app/node_modules
    command: >
      sh -c "sleep 15 && npm install && npx prisma generate && npx prisma migrate deploy && npm run seed"
    restart: "no"

volumes:
  pgdata:
  client_node_modules:
  server_node_modules:
